name: Lanzamiento de infra-hub-api (dev)

on:
  workflow_dispatch:
    inputs:
      previous_stable_tag:
        description: "Tag que se mantiene como la última versión estable conocida"
        required: true
        type: string
      new_tag:
        description: "Nuevo tag de versión para compilar, publicar y desplegar"
        required: true
        type: string

concurrency:
  group: release-infra-hub-api-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      environment: dev
      approver_environment: development-approver
      deploy_workflow: deploy-infra-hub-api-dev.yml
      deploy_ref: dev
      previous_stable_tag: ${{ inputs.previous_stable_tag }}
      new_tag: ${{ inputs.new_tag }}
    secrets: inherit
